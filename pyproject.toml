[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clockbars"
version = "1.0.0"
description = "Bars sampled on the market's own clock: tick, volume, and dollar bars in Polars, batch and streaming with proven parity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zzionz" }]
keywords = [
  "quantitative-finance",
  "market-microstructure",
  "order-flow",
  "polars",
  "financial-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = ["polars>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "pyarrow>=15",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
]

[project.urls]
Homepage = "https://github.com/zzionz/clockbars"
Issues = "https://github.com/zzionz/clockbars/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clockbars"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.coverage.run]
source = ["clockbars"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
