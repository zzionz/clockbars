name: Release

# A release is published only through a GitHub Release, and only after the
# full gate set passes on the tagged commit. PyPI authentication is trusted
# publishing (OIDC) — no tokens stored anywhere.

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q --cov=clockbars

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
